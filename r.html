<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --teal:#0f9d8f;
      --ink:#14171a;
      --ink-2:#1d2126;
      --line:rgba(255,255,255,0.09);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    /* Redirect (string card) view — light spinner */
    body{font-family:'Inter',system-ui,-apple-system,sans-serif}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#333;padding:20px;text-align:center}
    .spin{width:34px;height:34px;border:3px solid #ddd;border-top-color:#555;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{color:#0a58ca}
    .err{max-width:420px}
    /* Hub (object card) view — dark, matches the approved design */
    body.hub{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
    .card{width:100%;max-width:380px;background:var(--ink-2);border-radius:24px;padding:32px 24px 28px;text-align:center;border:1px solid var(--line)}
    .biz-name{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;margin-bottom:22px;line-height:1.3}
    .gicon{width:52px;margin:0 auto 6px;display:block}
    .stars{display:flex;justify-content:center;gap:4px;margin-bottom:20px}
    .stars svg{width:14px;height:14px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:15px;margin-bottom:10px;text-decoration:none;transition:transform .15s ease;color:#fff}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:var(--teal);color:#062e28;font-size:16px;padding:17px}
    .btn-secondary{background:#262b30;color:#fff;border:1px solid var(--line)}
    .btn svg{width:18px;height:18px;flex:none}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid2 .btn{margin-bottom:0}
    .footer{margin-top:20px;font-size:11px;color:rgba(255,255,255,0.4)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" id="spin"></div>
    <div id="msg">Taking you to the review page…</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = (params.get('id') || '').trim();

      function fail(text) {
        document.body.className = '';
        document.body.innerHTML =
          '<div class="wrap"><div class="err">' + text + '</div></div>';
      }

      // Allow only web links and tel: — never javascript:, data:, etc.
      function safeHref(href) {
        return /^(https?:|tel:)/i.test(String(href == null ? '' : href).trim())
          ? String(href).trim() : null;
      }

      // --- static SVG bits from the approved design ---
      var GOOGLE_ICON =
        '<svg class="gicon" viewBox="0 0 48 48">' +
        '<path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.6-6.6C35.6 2.5 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.7 6C12.2 13.1 17.6 9.5 24 9.5z"/>' +
        '<path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.9 37.6 46.5 31.6 46.5 24.5z"/>' +
        '<path fill="#FBBC05" d="M10.3 19.2c-.6 1.7-.9 3.4-.9 5.3s.3 3.6.9 5.3l-7.7 6C1 32.4 0 28.4 0 24.5s1-7.9 2.6-11.3l7.7 6z"/>' +
        '<path fill="#34A853" d="M24 49c6.1 0 11.6-2 15.4-5.6l-7.3-5.7c-2 1.4-4.7 2.3-8.1 2.3-6.4 0-11.8-3.6-13.7-8.7l-7.7 6C6.5 43.6 14.6 49 24 49z"/>' +
        '</svg>';
      var STAR = '<svg viewBox="0 0 24 24" fill="#f5b400"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.6z"/></svg>';
      var STARS = '<div class="stars">' + STAR + STAR + STAR + STAR + STAR + '</div>';
      var PRIMARY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#062e28" stroke-width="2.2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.6z"/></svg>';

      // key -> [label, icon svg]. Rendered in this order, only when present.
      var SECONDARY = [
        ['instagram', 'Instagram', '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>'],
        ['telegram',  'Telegram',  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 2L3 9l5 2m10-9l-4 16-5-6m9-10L8 11"/></svg>'],
        ['phone',     "Qo'ng'iroq",'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.1-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.2-1.3a2 2 0 012.1-.5c1 .4 2 .6 3 .7a2 2 0 011.7 2z"/></svg>'],
        ['facebook',  'Facebook',  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2z"/><circle cx="12" cy="18" r="1" fill="#fff"/></svg>']
      ];

      function makeBtn(cls, iconSvg, label, href) {
        var h = safeHref(href);
        if (!h) return null;
        var a = document.createElement('a');
        a.className = 'btn ' + cls;
        a.href = h;
        a.rel = 'noopener noreferrer';
        if (!/^tel:/i.test(h)) a.target = '_top';
        a.innerHTML = iconSvg + '<span></span>';
        a.querySelector('span').textContent = label;   // label set safely
        return a;
      }

      function renderHub(h) {
        document.title = h.business_name || 'Reviews';

        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<div class="biz-name"></div>' + GOOGLE_ICON + STARS +
                         '<div class="grid2"></div>' +
                         '<div class="footer">otvizcards.uz · Sizga ham karta kerakmi?</div>';

        var nameEl = card.querySelector('.biz-name');
        if (h.business_name) nameEl.textContent = h.business_name;
        else nameEl.remove();

        var count = 0;
        var primary = makeBtn('btn-primary', PRIMARY_ICON, "Google'da baho qoldiring", h.review_url);
        if (primary) { card.insertBefore(primary, card.querySelector('.grid2')); count++; }

        var grid = card.querySelector('.grid2');
        SECONDARY.forEach(function (s) {
          var b = makeBtn('btn-secondary', s[2], s[1], h[s[0]]);
          if (b) { grid.appendChild(b); count++; }
        });
        if (!grid.children.length) grid.remove();

        if (!count) { fail('Card <b>' + id + '</b> has no valid links yet.'); return; }

        document.body.className = 'hub';
        document.body.innerHTML = '';
        document.body.appendChild(card);
      }

      if (!id) {
        fail('No card id in the link. The link should look like <code>r.html?id=001</code>.');
        return;
      }

      // Cache-bust so a freshly reassigned card resolves immediately.
      fetch('mapping.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('mapping ' + r.status);
          return r.json();
        })
        .then(function (map) {
          var cards = map.cards || {};
          var entry = cards[id];

          // Object entry → hub landing page (only "hub" supported for now).
          if (entry && typeof entry === 'object') {
            if (entry.type === 'hub') { renderHub(entry); return; }
            fail('Card <b>' + id + '</b> has an unsupported configuration.');
            return;
          }

          // String entry (or fall back to the default) → direct redirect.
          var fallback = (map.config && map.config.default_destination) || '';
          var dest = (typeof entry === 'string' && entry) ? entry : fallback;
          if (!dest) {
            fail('Card <b>' + id + '</b> is not assigned yet, and no default destination is set.');
            return;
          }
          location.replace(dest);
        })
        .catch(function () {
          fail('Could not load the card list. Please try again in a moment.');
        });
    })();
  </script>
</body>
</html>
