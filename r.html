<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#333}
    .spin{width:34px;height:34px;border:3px solid #ddd;border-top-color:#555;border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{color:#0a58ca}
    .err{max-width:420px;text-align:center;padding:0 20px}
    /* Debug page for unassigned cards */
    .debug{background:#111;color:#f5f5f5}
    .debug .wrap{color:#f5f5f5;gap:18px;padding:0 24px;text-align:center}
    .card-num{font-size:clamp(40px,14vw,88px);font-weight:700;letter-spacing:1px;margin:0}
    .card-sub{font-size:clamp(15px,4.5vw,20px);color:#b0b0b0;margin:0;max-width:420px}
    .tg-link{margin-top:10px;font-size:15px;color:#8ab4ff}
    .tg-link a{color:#8ab4ff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" id="spin"></div>
    <div id="msg">Taking you to the review page…</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = (params.get('id') || '').trim();

      function fail(text) {
        document.getElementById('spin').style.display = 'none';
        document.getElementById('msg').innerHTML =
          '<div class="err">' + text + '</div>';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // Debug page shown for cards that are not yet assigned to a business.
      function showUnassigned(cardId) {
        document.title = 'Card #' + cardId;
        document.body.className = 'debug';
        document.body.innerHTML =
          '<div class="wrap">' +
            '<h1 class="card-num">Card #' + escapeHtml(cardId) + '</h1>' +
            '<p class="card-sub">This card is not yet assigned to a business.</p>' +
            '<p class="tg-link">Not assigned yet? Message us: ' +
              '<a href="https://t.me/otvizcards">https://t.me/otvizcards</a></p>' +
          '</div>';
      }

      if (!id) {
        fail('No card id in the link. The link should look like <code>r.html?id=001</code>.');
        return;
      }

      // Cache-bust so a freshly reassigned card resolves immediately.
      fetch('mapping.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('mapping ' + r.status);
          return r.json();
        })
        .then(function (map) {
          var cards = map.cards || {};
          var fallback = (map.config && map.config.default_destination) || '';
          var dest = cards[id] || fallback;
          if (!dest) {
            fail('Card <b>' + id + '</b> is not assigned yet, and no default destination is set.');
            return;
          }
          if (dest === 'UNASSIGNED') {
            showUnassigned(id);
            return;
          }
          location.replace(dest);
        })
        .catch(function () {
          fail('Could not load the card list. Please try again in a moment.');
        });
    })();
  </script>
</body>
</html>
